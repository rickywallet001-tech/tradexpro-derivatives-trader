name: Targeted Manual Trader auth repair

# Triggered deliberately after review so the surgical source patch is applied and build-tested before merge.

on:
  push:
    branches:
      - fix/manual-trader-auth-otp

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply surgical auth fixes
        shell: python
        run: |
          from pathlib import Path

          client = Path('packages/core/src/Stores/client-store.js')
          socket = Path('packages/core/src/_common/base/socket_base.js')

          c = client.read_text()
          s = socket.read_text()

          replacements = [
              (
                  "    is_authorize = false;\n",
                  "    is_authorize = false;\n    // True when the current WebSocket was authenticated through Deriv's OAuth/OTP flow.\n    // Unlike the legacy session_token path, this token must never be sent to legacy authorize().\n    is_otp_authenticated = false;\n    otp_access_token = null;\n",
              ),
              (
                  "            is_authorize: observable,\n",
                  "            is_authorize: observable,\n            is_otp_authenticated: observable,\n",
              ),
              (
                  "    get is_logged_in() {\n        const hasSessionToken = !!this.getStoredSessionToken();\n        const hasCurrentAccountLoginId = !!this.current_account?.loginid;\n        const hasLoginId = !!this.loginid;\n        return hasSessionToken && hasCurrentAccountLoginId && hasLoginId;\n    }\n",
                  "    get is_logged_in() {\n        const hasSessionToken = !!this.getStoredSessionToken();\n        const hasAuthenticatedOtpSession = this.is_otp_authenticated;\n        const hasCurrentAccountLoginId = !!this.current_account?.loginid;\n        const hasLoginId = !!this.loginid;\n        return (hasSessionToken || hasAuthenticatedOtpSession) && hasCurrentAccountLoginId && hasLoginId;\n    }\n",
              ),
              (
                  "    setIsAuthorize(value) {\n        this.is_authorize = value;\n    }\n",
                  "    setIsAuthorize(value) {\n        this.is_authorize = value;\n    }\n\n    async reconnectOtp() {\n        if (!this.otp_access_token) return false;\n        const response = await this.authenticateV2(this.otp_access_token);\n        return !response?.error;\n    }\n",
              ),
              (
                  "        this.loginid = null;\n        this.user_id = null;\n        this.current_account = null;\n",
                  "        this.loginid = null;\n        this.user_id = null;\n        this.current_account = null;\n        this.setIsAuthorize(false);\n        this.is_otp_authenticated = false;\n        this.otp_access_token = null;\n",
              ),
              (
                  "                    const storedAccounts = JSON.parse(localStorage.getItem('client.accounts') || '[]');\n                    accountMeta = storedAccounts.find(a => a.account === accountId) || {};\n",
                  "                    const storedAccounts = JSON.parse(localStorage.getItem('client.accounts') || '{}');\n                    accountMeta = Array.isArray(storedAccounts)\n                        ? storedAccounts.find(a => a.account === accountId) || {}\n                        : storedAccounts?.[accountId] || {};\n",
              ),
              (
                  "                const authorizeResponse = {\n                    authorize: {\n",
                  "                this.otp_access_token = oneTimeToken;\n                this.is_otp_authenticated = true;\n\n                const authorizeResponse = {\n                    authorize: {\n",
              ),
          ]

          for old, new in replacements:
              count = c.count(old)
              if count != 1:
                  raise SystemExit(f'client-store patch anchor expected once, found {count}: {old[:80]!r}')
              c = c.replace(old, new)

          old = """    const close = () => {\n        binary_socket.close();\n    };\n"""
          new = """    const close = () => {\n        if (binary_socket) {\n            try {\n                binary_socket.close();\n            } catch (e) {\n                // The socket may already be closing/closed during an auth handoff.\n            }\n        }\n    };\n"""
          if s.count(old) != 1:
              raise SystemExit('socket close anchor not found exactly once')
          s = s.replace(old, new)

          old = """    const connectToOtpUrl = otpUrl => {\n        otp_override_url = otpUrl;\n        close();\n        is_switching_socket = true;\n        openNewConnection();\n        return new Promise((resolve, reject) => {\n            const timeout = setTimeout(() => reject(new Error('Timed out connecting to OTP-authenticated URL')), 15000);\n            deriv_api.onOpen().subscribe(() => {\n                clearTimeout(timeout);\n                resolve();\n            });\n        });\n    };\n"""
          new = """    const connectToOtpUrl = otpUrl => new Promise((resolve, reject) => {\n        if (!otpUrl) {\n            reject(new Error('Missing OTP-authenticated WebSocket URL'));\n            return;\n        }\n\n        const previous_socket = binary_socket;\n        is_switching_socket = true;\n\n        // The old socket can still be CONNECTING. Calling close() and then\n        // immediately calling openNewConnection() used to race: isClose()\n        // could still see readyState === CONNECTING and reuse the old socket,\n        // so the promised OTP connection was never actually created.\n        if (previous_socket) {\n            try {\n                previous_socket.close();\n            } catch (e) {\n                // Best effort; a CLOSED socket needs no further action.\n            }\n        }\n\n        otp_override_url = otpUrl;\n        binary_socket = null;\n        deriv_api = null;\n        openNewConnection();\n\n        const socket = binary_socket;\n        if (!socket) {\n            otp_override_url = null;\n            reject(new Error('Failed to create OTP-authenticated WebSocket'));\n            return;\n        }\n\n        let settled = false;\n        const finish = (error = null) => {\n            if (settled) return;\n            settled = true;\n            clearTimeout(timeout);\n            socket.removeEventListener('open', on_open);\n            socket.removeEventListener('error', on_error);\n            socket.removeEventListener('close', on_close);\n            if (error) {\n                otp_override_url = null;\n                reject(error);\n            } else {\n                // The OTP is one-use. Future reconnects must request a fresh\n                // OTP through client_store.reconnectOtp(), not reuse this URL.\n                otp_override_url = null;\n                resolve();\n            }\n        };\n        const on_open = () => finish();\n        const on_error = () => finish(new Error('OTP-authenticated WebSocket connection failed'));\n        const on_close = () => finish(new Error('OTP-authenticated WebSocket closed before it was established'));\n        const timeout = setTimeout(() => finish(new Error('Timed out connecting to OTP-authenticated URL')), 15000);\n\n        socket.addEventListener('open', on_open, { once: true });\n        socket.addEventListener('error', on_error, { once: true });\n        socket.addEventListener('close', on_close, { once: true });\n    });\n"""
          if s.count(old) != 1:
              raise SystemExit('connectToOtpUrl anchor not found exactly once')
          s = s.replace(old, new)

          old = """    const openNewConnection = () => {\n        const mock_server_config = getMockServerConfig();\n"""
          new = """    const openNewConnection = () => {\n        // OAuth/OTP sessions cannot be re-authorized through legacy\n        // authorize(). When a reconnect is requested, ask the parent-token\n        // backed client store for a fresh one-use OTP URL instead.\n        if (!otp_override_url && client_store?.is_otp_authenticated && client_store?.reconnectOtp) {\n            client_store.reconnectOtp().catch(error => {\n                console.error('[socket_base] OTP reconnect failed:', error);\n            });\n            return;\n        }\n\n        const mock_server_config = getMockServerConfig();\n"""
          if s.count(old) != 1:
              raise SystemExit('openNewConnection anchor not found exactly once')
          s = s.replace(old, new)

          client.write_text(c)
          socket.write_text(s)
          print('Applied targeted Manual Trader authentication/socket fixes.')

      - name: Verify changes
        run: |
          git diff --check
          npm ci --strict-peer-deps --verbose
          npm run build --workspace=@deriv/core

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "TradeXpro Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/repair-manual-auth.yml
          git add packages/core/src/Stores/client-store.js packages/core/src/_common/base/socket_base.js .github/workflows/repair-manual-auth.yml
          git commit -m "fix: complete OAuth OTP authentication lifecycle for Manual Traders"
          git push origin HEAD:fix/manual-trader-auth-otp
